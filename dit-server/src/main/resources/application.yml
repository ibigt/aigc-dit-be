server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: dit-server
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:172.171.113.250}:${POSTGRES_PORT:5432}/${POSTGRES_DB:dit}
    username: ${POSTGRES_USER:fnii}
    password: ${POSTGRES_PASSWORD:Fnii@123}
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: ${REDIS_HOST:172.171.113.250}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 15s
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
    # V1 内容调整后忽略旧 checksum；若曾执行过已删除的 V2，忽略 missing
    validate-on-migrate: false
    ignore-migration-patterns:
      - "*:checksum"
      - "*:missing"
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  type-handlers-package: cn.aigc.dit.server.mybatis
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

dit:
  storage:
    # 统一数据根，默认 /mnt/ai-gc；改 root 后子目录会跟着变，也可单独改某一项
    root: /mnt/ai-gc
    postgres: ${dit.storage.root}/postgres
    redis: ${dit.storage.root}/redis
    minio: ${dit.storage.root}/minio
    logs: ${dit.storage.root}/logs
  jwt:
    secret: ${JWT_SECRET:FAKESECRET_c4d5e6f7g8h9i0j1k2l3}
    expire-seconds: ${JWT_EXPIRE_SECONDS:86400}
  crypto:
    secret: ${CRYPTO_SECRET:${JWT_SECRET:dit-dev-jwt-secret-change-me-32b}}
  admin:
    username: ${DIT_ADMIN_USERNAME:admin}
    password: ${DIT_ADMIN_PASSWORD:Fnii@123}
    display-name: 系统管理员
    email: ${DIT_ADMIN_EMAIL:admin@localhost}
  generate:
    default-provider: mock
    mock:
      delay-ms: ${MOCK_DELAY_MS:2500}
    worker:
      enabled: true
      stream: dit:gen-tasks
      group: dit-workers
      poll-interval-ms: 2000
      timeout-seconds: ${GENERATE_TIMEOUT_SECONDS:1800}
    comfyui:
      # Adapter 始终注册。enabled 只控制 compose 是否拉起 sidecar；远程 ComfyUI 用模型 endpoint。
      enabled: ${COMFYUI_ENABLED:false}
      base-url: ${COMFYUI_BASE_URL:http://127.0.0.1:8188}
      connect-timeout-seconds: 15
      request-timeout-seconds: 60
      download-timeout-seconds: 600
    runninghub:
      base-url: ${RUNNINGHUB_BASE_URL:https://www.runninghub.ai}
      api-key: ${RUNNINGHUB_API_KEY:}
      t2i-path: ${RUNNINGHUB_T2I_PATH:rhart-image-g-2/text-to-image}
      t2v-path: ${RUNNINGHUB_T2V_PATH:rhart-video/sparkvideo-2.0/text-to-video}
      r2v-path: ${RUNNINGHUB_R2V_PATH:rhart-video/sparkvideo-2.0/multimodal-video}
      max-calls: ${RUNNINGHUB_MAX_CALLS:0}
      force-resolution: 1k
      force-quality: low
      download-timeout-seconds: ${RUNNINGHUB_DOWNLOAD_TIMEOUT_SECONDS:600}
      download-retries: ${RUNNINGHUB_DOWNLOAD_RETRIES:3}
    agnes:
      base-url: ${AGNES_BASE_URL:https://api.agnes-ai.cn/v1}
      api-key: ${AGNES_API_KEY:}
      connect-timeout-seconds: 15
      request-timeout-seconds: ${AGNES_REQUEST_TIMEOUT_SECONDS:180}
      poll-timeout-seconds: 30
      poll-interval-seconds: ${AGNES_POLL_INTERVAL_SECONDS:5}
      rate-limit-backoff-seconds: ${AGNES_RATE_LIMIT_BACKOFF_SECONDS:8}
      download-timeout-seconds: ${AGNES_DOWNLOAD_TIMEOUT_SECONDS:600}
      download-retries: ${AGNES_DOWNLOAD_RETRIES:3}
  s3:
    endpoint: ${S3_ENDPOINT:http://172.171.113.250:9000}
    bucket: ${S3_BUCKET:dit}
    access-key: ${S3_ACCESS_KEY:ditminio}
    secret-key: ${S3_SECRET_KEY:DitMinio123}
    region: ${S3_REGION:us-east-1}
    path-style: true

logging:
  level:
    cn.aigc.dit: INFO
