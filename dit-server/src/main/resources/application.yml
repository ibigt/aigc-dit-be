server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: dit-server
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:172.171.113.250}:${POSTGRES_PORT:5432}/${POSTGRES_DB:dit}
    username: ${POSTGRES_USER:fnii}
    password: ${POSTGRES_PASSWORD:Fnii@123}
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: ${REDIS_HOST:172.171.113.250}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 15s
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    # V1 合入后忽略旧 checksum；曾执行过已删除的 V2/V3/V4/V5 时忽略 missing。
    validate-on-migrate: false
    ignore-migration-patterns:
      - "*:checksum"
      - "*:missing"
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  type-handlers-package: cn.aigc.dit.server.mybatis
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

dit:
  storage:
    # 统一数据根，默认 /mnt/ai-gc；改 root 后子目录会跟着变，也可单独改某一项
    root: /mnt/ai-gc
    postgres: ${dit.storage.root}/postgres
    redis: ${dit.storage.root}/redis
    minio: ${dit.storage.root}/minio
    logs: ${dit.storage.root}/logs
  jwt:
    secret: ${JWT_SECRET:FAKESECRET_c4d5e6f7g8h9i0j1k2l3}
    expire-seconds: ${JWT_EXPIRE_SECONDS:86400}
  crypto:
    secret: ${CRYPTO_SECRET:${JWT_SECRET:dit-dev-jwt-secret-change-me-32b}}
  admin:
    username: ${DIT_ADMIN_USERNAME:admin}
    password: ${DIT_ADMIN_PASSWORD:Fnii@123}
    display-name: 系统管理员
    email: ${DIT_ADMIN_EMAIL:admin@localhost}
  generate:
    default-provider: mock
    mock:
      delay-ms: ${MOCK_DELAY_MS:2500}
    worker:
      enabled: true
      stream: dit:gen-tasks
      group: dit-workers
      poll-interval-ms: 2000
      timeout-seconds: ${GENERATE_TIMEOUT_SECONDS:1800}
      max-concurrent: ${GENERATE_MAX_CONCURRENT:8}
    comfyui:
      # Adapter 始终注册。enabled 只控制 compose 是否拉起 sidecar；远程 ComfyUI 用模型 endpoint。
      enabled: ${COMFYUI_ENABLED:false}
      base-url: ${COMFYUI_BASE_URL:http://127.0.0.1:8188}
      connect-timeout-seconds: 15
      request-timeout-seconds: ${COMFYUI_REQUEST_TIMEOUT_SECONDS:180}
      download-timeout-seconds: 600
    runninghub:
      base-url: ${RUNNINGHUB_BASE_URL:https://www.runninghub.ai}
      api-key: ${RUNNINGHUB_API_KEY:}
      t2i-path: ${RUNNINGHUB_T2I_PATH:rhart-image-g-2/text-to-image}
      i2i-path: ${RUNNINGHUB_I2I_PATH:rhart-image-g-2/image-to-image}
      t2v-path: ${RUNNINGHUB_T2V_PATH:rhart-video/sparkvideo-2.0/text-to-video}
      r2v-path: ${RUNNINGHUB_R2V_PATH:rhart-video/sparkvideo-2.0/multimodal-video}
      max-calls: ${RUNNINGHUB_MAX_CALLS:0}
      force-resolution: 1k
      force-quality: low
      download-timeout-seconds: ${RUNNINGHUB_DOWNLOAD_TIMEOUT_SECONDS:600}
      download-retries: ${RUNNINGHUB_DOWNLOAD_RETRIES:3}
    agnes:
      base-url: ${AGNES_BASE_URL:https://api.agnes-ai.cn/v1}
      api-key: ${AGNES_API_KEY:}
      connect-timeout-seconds: 15
      request-timeout-seconds: ${AGNES_REQUEST_TIMEOUT_SECONDS:180}
      poll-timeout-seconds: 30
      poll-interval-seconds: ${AGNES_POLL_INTERVAL_SECONDS:5}
      rate-limit-backoff-seconds: ${AGNES_RATE_LIMIT_BACKOFF_SECONDS:8}
      download-timeout-seconds: ${AGNES_DOWNLOAD_TIMEOUT_SECONDS:600}
      download-retries: ${AGNES_DOWNLOAD_RETRIES:3}
    ark:
      base-url: ${ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
      api-key: ${ARK_API_KEY:}
      # 素材库 HMAC。模型管理里保存的审核密钥优先；这里只在尚未在页面配置时兜底。
      access-key: ${ARK_ACCESS_KEY:}
      secret-key: ${ARK_SECRET_KEY:}
      project-name: ${ARK_PROJECT_NAME:default}
      asset-group-id: ${ARK_ASSET_GROUP_ID:}
      asset-endpoint: ${ARK_ASSET_ENDPOINT:https://ark.cn-beijing.volcengineapi.com}
      connect-timeout-seconds: 15
      request-timeout-seconds: ${ARK_REQUEST_TIMEOUT_SECONDS:120}
      poll-timeout-seconds: 30
      poll-interval-seconds: ${ARK_POLL_INTERVAL_SECONDS:5}
      rate-limit-backoff-seconds: ${ARK_RATE_LIMIT_BACKOFF_SECONDS:8}
      download-timeout-seconds: ${ARK_DOWNLOAD_TIMEOUT_SECONDS:600}
      download-retries: ${ARK_DOWNLOAD_RETRIES:3}
    minimax:
      base-url: ${MINIMAX_BASE_URL:https://api.minimax.cn}
      api-key: ${MINIMAX_API_KEY:}
      connect-timeout-seconds: 15
      request-timeout-seconds: ${MINIMAX_REQUEST_TIMEOUT_SECONDS:120}
      poll-timeout-seconds: 30
      poll-interval-seconds: ${MINIMAX_POLL_INTERVAL_SECONDS:10}
      rate-limit-backoff-seconds: ${MINIMAX_RATE_LIMIT_BACKOFF_SECONDS:8}
      download-timeout-seconds: ${MINIMAX_DOWNLOAD_TIMEOUT_SECONDS:600}
      download-retries: ${MINIMAX_DOWNLOAD_RETRIES:3}
    speech:
      base-url: ${SPEECH_BASE_URL:https://api.openai.com/v1}
      api-key: ${SPEECH_API_KEY:}
      connect-timeout-seconds: ${SPEECH_CONNECT_TIMEOUT_SECONDS:15}
      request-timeout-seconds: ${SPEECH_REQUEST_TIMEOUT_SECONDS:180}
    ffmpeg:
      concat-copy-timeout-seconds: ${FFMPEG_CONCAT_COPY_TIMEOUT_SECONDS:180}
      concat-encode-timeout-seconds: ${FFMPEG_CONCAT_ENCODE_TIMEOUT_SECONDS:900}
      caption-burn-enabled: ${FFMPEG_CAPTION_BURN_ENABLED:false}
      caption-font: ${FFMPEG_CAPTION_FONT:}
      caption-timeout-seconds: ${FFMPEG_CAPTION_TIMEOUT_SECONDS:180}
    vad:
      enabled: ${SILERO_VAD_ENABLED:false}
      model-path: ${SILERO_VAD_MODEL_PATH:}
      threshold: ${SILERO_VAD_THRESHOLD:0.5}
      sample-rate: ${SILERO_VAD_SAMPLE_RATE:16000}
      frame-samples: ${SILERO_VAD_FRAME_SAMPLES:512}
      min-speech-ms: ${SILERO_VAD_MIN_SPEECH_MS:180}
      merge-gap-ms: ${SILERO_VAD_MERGE_GAP_MS:240}
      padding-ms: ${SILERO_VAD_PADDING_MS:80}
    forced-alignment:
      enabled: ${FORCED_ALIGNMENT_ENABLED:false}
      model-path: ${FORCED_ALIGNMENT_MODEL_PATH:/mnt/ai-gc/models/forced-alignment/zh_w2v2_tiny_fc_10ms/model_quantized.onnx}
      assets-path: ${FORCED_ALIGNMENT_ASSETS_PATH:/mnt/ai-gc/models/forced-alignment/assets}
      sample-rate: ${FORCED_ALIGNMENT_SAMPLE_RATE:16000}
      frame-ms: ${FORCED_ALIGNMENT_FRAME_MS:10}
      silence-threshold-frames: ${FORCED_ALIGNMENT_SILENCE_THRESHOLD_FRAMES:3}
      min-confidence: ${FORCED_ALIGNMENT_MIN_CONFIDENCE:0.0}
      min-coverage: ${FORCED_ALIGNMENT_MIN_COVERAGE:0.90}
      processor-version: ${FORCED_ALIGNMENT_PROCESSOR_VERSION:forced-alignment-1}
  s3:
    endpoint: ${S3_ENDPOINT:http://172.171.113.250:9000}
    # 只用于预签名。角色审核把这个 HTTPS 地址交给方舟下载，留空则仍签内部 endpoint。
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    bucket: ${S3_BUCKET:dit}
    access-key: ${S3_ACCESS_KEY:ditminio}
    secret-key: ${S3_SECRET_KEY:DitMinio123}
    region: ${S3_REGION:us-east-1}
    path-style: true

logging:
  level:
    cn.aigc.dit: INFO

pay:
  mock:
    # Mock 支付通道：true 时充值二维码为模拟值，可用 mock-pay 接口模拟支付回调；接入真实渠道后置 false
    enabled: ${PAY_MOCK_ENABLED:true}
  alipay:
    # 支付宝当面付：enabled 时注册 AlipayChannel；沙箱/正式仅密钥与网关不同。密钥一律走环境变量，勿写入仓库
    enabled: ${ALIPAY_ENABLED:false}
    app-id: ${ALIPAY_APP_ID:}
    merchant-private-key: ${ALIPAY_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
    gateway: ${ALIPAY_GATEWAY:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
    # 公网 HTTPS 回调地址（可选）；未配置时依赖查单兜底入账
    notify-url: ${ALIPAY_NOTIFY_URL:}
  wechat:
    # 微信支付 Native 扫码：enabled 时注册 WeChatChannel。无沙箱，联调用真实商户号小额支付后手动退款
    enabled: ${WXPAY_ENABLED:false}
    mch-id: ${WXPAY_MCH_ID:}
    app-id: ${WXPAY_APP_ID:}
    merchant-serial-no: ${WXPAY_MERCHANT_SERIAL_NO:}
    # 商户 API 证书私钥文件（apiclient_key.pem）路径
    private-key-path: ${WXPAY_PRIVATE_KEY_PATH:}
    api-v3-key: ${WXPAY_API_V3_KEY:}
    # Native 下单必填：公网 HTTPS 回调地址，如 https://your-domain/api/credits/recharge/wechat/notify
    notify-url: ${WXPAY_NOTIFY_URL:}
