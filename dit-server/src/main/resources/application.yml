server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: dit-server
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:dit}
    username: ${POSTGRES_USER:fnii}
    password: ${POSTGRES_PASSWORD:Fnii@123}
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  type-handlers-package: cn.aigc.dit.server.mybatis
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

dit:
  storage:
    # 统一数据根，默认 /mnt/ai-gc；改 root 后子目录会跟着变，也可单独改某一项
    root: /mnt/ai-gc
    postgres: ${dit.storage.root}/postgres
    redis: ${dit.storage.root}/redis
    minio: ${dit.storage.root}/minio
    logs: ${dit.storage.root}/logs
  jwt:
    secret: ${JWT_SECRET:FAKESECRET_c4d5e6f7g8h9i0j1k2l3}
    expire-seconds: ${JWT_EXPIRE_SECONDS:86400}
  crypto:
    secret: ${CRYPTO_SECRET:${JWT_SECRET:dit-dev-jwt-secret-change-me-32b}}
  admin:
    username: ${DIT_ADMIN_USERNAME:admin}
    password: ${DIT_ADMIN_PASSWORD:Fnii@123}
    display-name: 系统管理员
    email: ${DIT_ADMIN_EMAIL:admin@localhost}
  generate:
    default-provider: mock
    mock:
      delay-ms: ${MOCK_DELAY_MS:2500}
    worker:
      enabled: true
      stream: dit:gen-tasks
      group: dit-workers
      poll-interval-ms: 400
      timeout-seconds: 120
    comfyui:
      enabled: ${COMFYUI_ENABLED:false}
      base-url: ${COMFYUI_BASE_URL:http://127.0.0.1:8188}
  s3:
    endpoint: ${S3_ENDPOINT:}
    bucket: ${S3_BUCKET:dit}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    region: ${S3_REGION:us-east-1}
    path-style: true

logging:
  level:
    cn.aigc.dit: INFO
